apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holdings-ui
  labels:
    app.kubernetes.io/name: holdings-ui
    app.kubernetes.io/part-of: taptech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [holdings.taptech.net]
      secretName: holdings-ui-tls
  rules:
    - host: holdings.taptech.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holdings-ui
                port:
                  name: http
