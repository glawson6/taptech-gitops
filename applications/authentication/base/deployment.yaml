apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Restart this workload when a Secret or ConfigMap it references changes.
    # Env-var secrets are fixed at container start -- without this, a rotated
    # credential silently never takes effect. Remove the annotation to opt out.
    reloader.stakater.com/auto: "true"
  name: authentication
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentication
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentication
    spec:
      serviceAccountName: authentication
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.taptech.net/taptech/authentication
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: default            # overlays patch this
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
          # Spring Boot Actuator. Adjust if a service does not expose it.
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
