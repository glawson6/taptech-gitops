apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporting
  labels:
    app.kubernetes.io/name: reporting
    app.kubernetes.io/part-of: taptech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [reporting.taptech.net]
      secretName: reporting-tls
  rules:
    - host: reporting.taptech.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reporting
                port:
                  name: http
