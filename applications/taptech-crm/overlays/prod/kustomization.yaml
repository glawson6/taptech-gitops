apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taptech-prod

resources:
  - ../../base
  - ingress.yaml

labels:
  - pairs:
      taptech.net/env: prod

replicas:
  - count: 1
    name: taptech-crm

patches:
  - path: patch-resources.yaml

# ---- Jenkins writes this line ----
#   kustomize edit set image tooling.taptech.net:5000/taptech-platform-app=tooling.taptech.net:5000/taptech-platform-app:<tag>
# Keep it immutable (git sha or build number), never 'latest'.
images:
  - name: tooling.taptech.net:5000/taptech-platform-app
    newName: tooling.taptech.net:5000/taptech-platform-app
    newTag: placeholder
