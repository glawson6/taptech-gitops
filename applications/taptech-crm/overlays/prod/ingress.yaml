apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taptech-crm
  labels:
    app.kubernetes.io/name: taptech-crm
    app.kubernetes.io/part-of: taptech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Deliberately NO IP allowlist: this is public form intake. Protection
    # is captcha + submission token + rate-limit in-app (see configmap).
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api-crm.taptech.net]
      secretName: taptech-crm-tls
  rules:
    - host: api-crm.taptech.net
      http:
        paths:
          # All four public paths (/leads, /leads/*, /forms/leads/token,
          # /captcha, /captcha/*.png) route to the same backend Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taptech-crm
                port:
                  name: http
