# Runtime secrets for the CRM lead-intake service, materialized from
# 1Password vault `taptech-prod` by the External Secrets Operator.
#
# Rotation: the Deployment's `reloader.stakater.com/auto: "true"` annotation
# restarts the Pod when this Secret's contents change.
#
# 1Password items MUST already exist in vault `taptech-prod`:
#   TapTech-CRM-Redis   field: password    (distinct from mcp-client and
#                                            calendar Redis creds so they
#                                            rotate independently)
#
# Day-2 additions (leave commented until each is wired):
#   TapTech-SMTP2GO     field: api-key, username, password
#   TapTech-Turnstile   field: secret-key    (only if captcha.provider=turnstile)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-crm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taptech-crm-secrets
    creationPolicy: Owner
  data:
    # Uniquely named so this service's Redis credential rotates independently
    # from mcp-client and mcp-calendar. Mapped into Spring's expected
    # spring.data.redis.password by an explicit env in the Deployment.
    - secretKey: TAPTECH_CRM_REDIS_PASSWORD
      remoteRef:
        key: TapTech-CRM-Redis/password
