apiVersion: v1
kind: ServiceAccount
metadata:
  name: taptech-gitops-agent-service
# The agent talks to external APIs (ArgoCD REST, Jenkins REST, git push,
# op CLI) using tokens from Secrets. It does not need in-cluster RBAC by
# default, so no API token is mounted.
automountServiceAccountToken: false
# Sourced from 1Password by the ExternalSecret in platform/app-namespaces.
imagePullSecrets:
  - name: registry-pull
