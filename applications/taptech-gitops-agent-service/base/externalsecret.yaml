# Runtime secrets for taptech-gitops-agent, materialized from 1Password
# vault `taptech-prod` by the External Secrets Operator.
#
# Every entry maps a container env var to a 1Password ITEM/field.
# Rotation: the Deployment's `reloader.stakater.com/auto: "true"` annotation
# restarts the Pod when this Secret's contents change.
#
# 1Password items MUST already exist in vault `taptech-prod`:
#   TapTech-Anthropic-API         field: api-key
#   TapTech-GitOps-Agent-Argocd   field: token
#   TapTech-GitOps-Agent-Jenkins  fields: username, token
#   TapTech-GitOps-Agent-Git      field: token          (GitHub PAT with repo scope on glawson6/taptech-gitops)
#   TapTech-GitOps-Agent-Bot      field: token          (Telegram bot token)
#   TapTech-GitOps-Agent-Bot      field: allowed-users  (comma-separated Telegram user IDs)
#   TapTech-GitOps-Agent-Gateway  field: api-key        (JAICLAW_API_KEY for REST auth)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-gitops-agent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taptech-gitops-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: TapTech-Anthropic-API/api-key
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: TapTech-GitOps-Agent-Argocd/token
    - secretKey: JENKINS_USER
      remoteRef:
        key: TapTech-GitOps-Agent-Jenkins/username
    - secretKey: JENKINS_TOKEN
      remoteRef:
        key: TapTech-GitOps-Agent-Jenkins/token
    - secretKey: GITOPS_REPO_TOKEN
      remoteRef:
        key: TapTech-GitOps-Agent-Git/token
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TapTech-GitOps-Agent-Bot/token
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: TapTech-GitOps-Agent-Bot/allowed-users
    - secretKey: JAICLAW_API_KEY
      remoteRef:
        key: TapTech-GitOps-Agent-Gateway/api-key
