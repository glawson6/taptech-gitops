apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-client
# The chat backend talks to Anthropic (via MiniMax) and Redis using tokens
# from Secrets; it needs no in-cluster RBAC, so no API token is mounted.
automountServiceAccountToken: false
# Sourced from 1Password by the ExternalSecret in platform/app-namespaces.
imagePullSecrets:
  - name: registry-pull
