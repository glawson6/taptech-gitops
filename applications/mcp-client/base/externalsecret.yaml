# Runtime secrets for mcp-client, materialized from 1Password vault
# `taptech-prod` by the External Secrets Operator.
#
# Rotation: the Deployment's `reloader.stakater.com/auto: "true"` annotation
# restarts the Pod when this Secret's contents change.
#
# 1Password items MUST already exist in vault `taptech-prod`:
#   TapTech-Anthropic-API       field: api-key
#   TapTech-MCP-Client-Redis    field: password    (distinct from calendar
#                                                   and CRM Redis creds so
#                                                   they rotate independently)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-client-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: TapTech-Anthropic-API/api-key
    # Uniquely named so the same 1Password item isn't shared with other
    # services. Mapped into Spring's expected spring.data.redis.password
    # by an explicit env in the Deployment (not via envFrom).
    - secretKey: MCP_CLIENT_REDIS_PASSWORD
      remoteRef:
        key: TapTech-MCP-Client-Redis/password
