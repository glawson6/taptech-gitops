apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# includeSelectors=false: spec.selector.matchLabels is IMMUTABLE on a
# Deployment. Anything Kustomize injects into it can never be changed
# without recreating the Deployment.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: mcp-client
      app.kubernetes.io/part-of: taptech

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

# Overlays override the tag. Jenkins never edits this file.
images:
  - name: tooling.taptech.net:5000/taptech-ai-agent-mcp-client
    newTag: placeholder
