apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-client
  labels:
    app.kubernetes.io/name: mcp-client
    app.kubernetes.io/part-of: taptech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # /api/chat/stream is Server-Sent Events. Default nginx timeout (60s)
    # kills long-running streams mid-response.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp-client.taptech.net]
      secretName: mcp-client-tls
  rules:
    - host: mcp-client.taptech.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-client
                port:
                  name: http
