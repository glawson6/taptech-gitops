apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# includeSelectors=false is deliberate: spec.selector.matchLabels is IMMUTABLE
# on a Deployment. Anything Kustomize injects into it can never be changed
# without deleting the Deployment. The selector stays exactly what
# deployment.yaml declares.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: customer-service
      app.kubernetes.io/part-of: taptech

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

# Overlays override the tag. Jenkins never edits this file.
images:
  - name: registry.taptech.net/taptech/customer-service
    newTag: placeholder
