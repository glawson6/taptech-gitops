# Runtime secrets for mcp-calendar, materialized from 1Password vault
# `taptech-prod` by the External Secrets Operator.
#
# Rotation: the Deployment's `reloader.stakater.com/auto: "true"` annotation
# restarts the Pod when this Secret's contents change.
#
# 1Password items MUST already exist in vault `taptech-prod`:
#   TapTech-Calendar-Server-Redis   field: password   (distinct from
#                                                      mcp-client and CRM
#                                                      Redis creds so they
#                                                      rotate independently)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-calendar-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-calendar-secrets
    creationPolicy: Owner
  data:
    # Uniquely named so this service's Redis credential rotates independently
    # from mcp-client and taptech-crm. Mapped into Spring's expected
    # spring.data.redis.password by an explicit env in the Deployment.
    - secretKey: CALENDAR_SERVER_REDIS_PASSWORD
      remoteRef:
        key: TapTech-Calendar-Server-Redis/password
