apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taptech-prod
resources:
  - ../../base
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      taptech.net/env: prod

replicas:
  - name: jaiclaw-io
    count: 1

patches:
  - path: patch-resources.yaml

# ---- Jenkins writes this line ----
#   kustomize edit set image tooling.taptech.net:5000/jaiclaw-io=tooling.taptech.net:5000/jaiclaw-io:<tag>
# Keep it immutable (git sha or build number), never 'latest'.
images:
  - name: tooling.taptech.net:5000/jaiclaw-io
    newTag: "0.0.0-bootstrap"
