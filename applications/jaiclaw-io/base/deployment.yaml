apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Restart this workload when a Secret or ConfigMap it references changes.
    reloader.stakater.com/auto: "true"
  name: jaiclaw-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaiclaw-io
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaiclaw-io
    spec:
      serviceAccountName: jaiclaw-io
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: tooling.taptech.net:5000/jaiclaw-io
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # nginx-served React SPA -- no /actuator, health = GET /.
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
