# The single manifest applied by hand, against the MANAGEMENT cluster.
#   kubectl apply -f argocd/bootstrap/root.yaml
# Everything else -- including Argo CD's own Helm release -- flows from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/glawson6/taptech-gitops.git'
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      # Applications in clusters/apps-prod/ target `destination.name: apps-prod`,
      # which resolves via ArgoCD's cluster registry. Until that cluster is
      # registered (`argocd cluster add ... --name apps-prod` -- see
      # docs/adding-a-cluster.md), sync waves stall waiting on those apps.
      # Un-exclude the moment the apps cluster is registered.
      exclude: '{bootstrap/*,clusters/apps-prod/*}'
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
