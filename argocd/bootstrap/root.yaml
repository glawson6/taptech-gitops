# The single manifest applied by hand, against the MANAGEMENT cluster.
#   kubectl apply -f argocd/bootstrap/root.yaml
# Everything else -- including Argo CD's own Helm release -- flows from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/glawson6/taptech-gitops.git'
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      # bootstrap/* is always excluded -- root.yaml applies itself; the rest
      # of bootstrap/ is deliberately out-of-band (one-off installs).
      # clusters/apps-prod/* and appsets/* were previously excluded until
      # apps-prod was registered with ArgoCD; unblocked 2026-08-20 after
      # `argocd cluster add taptech-prod --name apps-prod`.
      exclude: '{bootstrap/*}'
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
