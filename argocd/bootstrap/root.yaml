# The single manifest applied by hand, against the MANAGEMENT cluster.
#   kubectl apply -f argocd/bootstrap/root.yaml
# Everything else -- including Argo CD's own Helm release -- flows from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/glawson6/taptech-gitops.git'
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      # Excluded until the apps-prod cluster is registered with ArgoCD
      # (`argocd cluster add ... --name apps-prod`, see docs/adding-a-cluster.md):
      #
      #   - clusters/apps-prod/*  -- Applications targeting the apps cluster
      #   - appsets/*             -- ApplicationSets generating child Apps for
      #                              app clusters; sets ErrorOccurred until the
      #                              destination cluster resolves, and that
      #                              propagates back as a failed sync task on
      #                              root, blocking wave advancement to the
      #                              mgmt-* Apps in later waves.
      #
      # Un-exclude both the moment the apps cluster is registered.
      exclude: '{bootstrap/*,clusters/apps-prod/*,appsets/*}'
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
