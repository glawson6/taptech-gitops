apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster infrastructure on every cluster. May create cluster-scoped resources.
  sourceRepos:
    - 'https://github.com/glawson6/taptech-gitops.git'
    - 'https://github.com/glawson6/taptech-sentinel.git'
    - 'https://charts.jetstack.io'
    - 'https://kubernetes.github.io/ingress-nginx'
    - 'https://kubernetes-sigs.github.io/external-dns'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://charts.external-secrets.io'
    - 'https://stakater.github.io/stakater-charts'
    - 'https://charts.jenkins.io'
    - 'https://argoproj.github.io/argo-helm'
    - 'https://charts.min.io'
  destinations:
    - name: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
