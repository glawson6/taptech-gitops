# Argo CD reconciling its own Helm release.
#
# bootstrap.sh installs this SAME chart+values with helm, so this Application
# adopts the existing release rather than fighting it. Do not switch bootstrap
# to raw install.yaml manifests -- the resource names differ and Argo CD would
# try to recreate everything underneath itself.
#
# Self-management means a bad values change can take out the controller applying
# it. Recovery is 'helm upgrade' by hand against the previous git revision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: in-cluster
    namespace: argocd
  sources:
    - repoURL: 'https://argoproj.github.io/argo-helm'
      chart: argo-cd
      targetRevision: 7.7.11   # VERIFY: helm search repo argo/argo-cd --versions
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: 'https://github.com/glawson6/taptech-gitops.git'
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: false      # never prune Argo CD's own resources automatically
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
