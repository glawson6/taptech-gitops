apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: in-cluster
    namespace: external-secrets
  sources:
    - repoURL: 'https://charts.external-secrets.io'
      chart: external-secrets
      targetRevision: 2.5.0   # VERIFY: helm search repo <repo>/external-secrets --versions
      helm:
        releaseName: external-secrets
        valueFiles:
          # Shared defaults first, per-cluster overrides second. Helm merges in
          # order, so the cluster file wins on any key it sets.
          - $values/platform/external-secrets/values.yaml
          - $values/platform/external-secrets/clusters/mgmt.yaml
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      path: platform/external-secrets/manifests/mgmt
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
