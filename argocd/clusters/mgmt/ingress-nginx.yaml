apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: in-cluster
    namespace: ingress-nginx
  sources:
    - repoURL: 'https://kubernetes.github.io/ingress-nginx'
      chart: ingress-nginx
      targetRevision: 4.12.0   # VERIFY: helm search repo <repo>/ingress-nginx --versions
      helm:
        releaseName: ingress-nginx
        valueFiles:
          # Shared defaults first, per-cluster overrides second. Helm merges in
          # order, so the cluster file wins on any key it sets.
          - $values/platform/ingress/values.yaml
          - $values/platform/ingress/clusters/mgmt.yaml
    - repoURL: 'https://github.com/glawson6/taptech-gitops.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://github.com/glawson6/taptech-gitops.git'
      targetRevision: main
      path: platform/ingress/manifests/mgmt
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
