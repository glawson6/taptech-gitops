apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-jenkins-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: 'https://github.com/taptech/taptech-gitops.git'
    targetRevision: main
    path: platform/jenkins-agents
  destination:
    name: in-cluster
    namespace: jenkins-agents
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
