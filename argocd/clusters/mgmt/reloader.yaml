apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: in-cluster
    namespace: reloader
  sources:
    - repoURL: 'https://stakater.github.io/stakater-charts'
      chart: reloader
      targetRevision: 2.2.12   # VERIFY: helm search repo <repo>/reloader --versions
      helm:
        releaseName: reloader
        valueFiles:
          # Shared defaults first, per-cluster overrides second. Helm merges in
          # order, so the cluster file wins on any key it sets.
          - $values/platform/reloader/values.yaml
          - $values/platform/reloader/clusters/mgmt.yaml
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      path: platform/reloader/manifests/mgmt
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
