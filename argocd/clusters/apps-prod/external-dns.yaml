apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-prod-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: apps-prod
    namespace: external-dns
  sources:
    - repoURL: 'https://kubernetes-sigs.github.io/external-dns'
      chart: external-dns
      targetRevision: 1.15.0   # VERIFY: helm search repo <repo>/external-dns --versions
      helm:
        releaseName: external-dns
        valueFiles:
          # Shared defaults first, per-cluster overrides second. Helm merges in
          # order, so the cluster file wins on any key it sets.
          - $values/platform/external-dns/values.yaml
          - $values/platform/external-dns/clusters/apps-prod.yaml
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://github.com/taptech/taptech-gitops.git'
      targetRevision: main
      path: platform/external-dns/manifests/apps-prod
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
