# Repo credential for the gitops repo itself.
#
# ArgoCD reads Secrets in the argocd namespace labelled
# `argocd.argoproj.io/secret-type=repository` and matches them to Applications
# by `url`. Without this, root Application can't authenticate to a private repo
# and every child sync fails with `authentication required`.
#
# Sourced from the same 1Password item Jenkins uses for git push. Rotating the
# PAT is a 1Password edit -- no commit here, no kubectl.
#
# CIRCULAR-BOOTSTRAP NOTE: on a FIRST bootstrap of a brand-new mgmt cluster,
# ArgoCD needs this Secret to exist BEFORE it can pull manifests from git --
# including this ExternalSecret. Bootstrap sequence handles that by creating a
# temporary literal Secret via kubectl in docs/bootstrap-mgmt-cluster.md, then
# once ArgoCD reconciles this ExternalSecret, the temporary one is overwritten
# by ESO (Owner creation policy) and the credential is git-managed from there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitops-repo-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # Preserve the label ArgoCD needs even though target metadata is
          # written by ESO, not by us.
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/glawson6/taptech-gitops.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: {key: gitops-repo/username}
    - secretKey: password
      remoteRef: {key: gitops-repo/password}
