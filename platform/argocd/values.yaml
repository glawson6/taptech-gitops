# Argo CD on the management cluster, managing itself plus every app cluster.
global:
  domain: argocd.taptech.net      # TODO confirm
configs:
  params:
    # TLS terminates at ingress-nginx; running the server insecure behind it
    # avoids the double-TLS redirect loop that otherwise bites here.
    server.insecure: true
    # Applications live in the argocd namespace only.
    application.namespaces: ""
  cm:
    # Kustomize needs this if a service ever inflates a Helm chart.
    kustomize.buildOptions: --enable-helm
    timeout.reconciliation: 180s
    # Cosmetic drift suppression for ESO. ExternalSecrets end up with two
    # kinds of drift after apply:
    #   1. `.status` mutates every reconcile (refreshTime, syncedResourceVersion)
    #   2. `.spec.data[*].remoteRef.*` picks up ESO admission defaults
    #      (conversionStrategy, decodingStrategy, metadataPolicy, nullBytePolicy)
    #      that aren't in the source manifest.
    # managedFieldsManagers is the clean fix: any field owned by the ESO
    # controller after apply is ignored by ArgoCD's diff. jsonPointers on
    # /status is a belt to that suspenders in case managed-fields tracking
    # ever drops.
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jsonPointers:
        - /status
      jqPathExpressions:
        # ESO's admission webhook fills in these defaults on every remoteRef
        # after ArgoCD applies. Strip them from the diff so specs that just
        # say `remoteRef: {key: foo/bar}` don't show OutOfSync forever.
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
    resource.customizations.ignoreDifferences.external-secrets.io_ClusterSecretStore: |
      jsonPointers:
        - /status
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # server.insecure=true above means ArgoCD server serves plain HTTP; the
      # ingress terminates TLS and forwards HTTP internally.
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      # Restrict UI access to trusted IPs. TODO: replace <YOUR-IP>/32 with your
      # workstation public IP; add CIDRs comma-separated. Remove the annotation
      # entirely to make it public (auth-only). See docs/mgmt-ui-inventory.md.
      nginx.ingress.kubernetes.io/whitelist-source-range: "104.14.172.65/32"
    hostname: argocd.taptech.net
    tls: true
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 256Mi}
applicationSet:
  replicas: 1
controller:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
redis:
  enabled: true
dex:
  enabled: false            # enable when you wire SSO
notifications:
  enabled: false
