# Argo CD on the management cluster, managing itself plus every app cluster.
global:
  domain: argocd.taptech.net      # TODO confirm
configs:
  params:
    # TLS terminates at ingress-nginx; running the server insecure behind it
    # avoids the double-TLS redirect loop that otherwise bites here.
    server.insecure: true
    # Applications live in the argocd namespace only.
    application.namespaces: ""
  cm:
    # Kustomize needs this if a service ever inflates a Helm chart.
    kustomize.buildOptions: --enable-helm
    timeout.reconciliation: 180s
    # Cosmetic drift suppression. ArgoCD's default diff treats any change to a
    # tracked resource's status as drift. Some CRDs mutate their own status on
    # every reconcile (refresh times, sync counts, resource versions); without
    # this, every ExternalSecret shows OutOfSync forever even though the spec
    # matches git perfectly. Applied cluster-wide so we don't repeat it per App.
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jsonPointers:
        - /status
    resource.customizations.ignoreDifferences.external-secrets.io_ClusterSecretStore: |
      jsonPointers:
        - /status
server:
  replicas: 1
  ingress:
    enabled: false          # enable once ingress + cert-manager are healthy
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 256Mi}
applicationSet:
  replicas: 1
controller:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
redis:
  enabled: true
dex:
  enabled: false            # enable when you wire SSO
notifications:
  enabled: false
