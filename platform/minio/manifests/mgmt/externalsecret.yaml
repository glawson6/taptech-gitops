# MinIO root credentials, sourced from the management vault. The chart's
# `existingSecret` expects keys named `rootUser` and `rootPassword`. Store the
# item in 1Password under `minio-root/username` and `minio-root/password`.
#
# The `minio-jenkins` credential (for Jenkins pipelines to write to MinIO)
# lives in the jenkins namespace instead -- see
# platform/jenkins/manifests/mgmt/externalsecrets.yaml. K8s Secrets don't
# cross namespaces, and the JCasC `additionalExistingSecrets` needs it local.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef: {key: minio-root/username}
    - secretKey: rootPassword
      remoteRef: {key: minio-root/password}
