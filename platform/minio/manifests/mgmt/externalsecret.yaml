# MinIO root credentials, sourced from the management vault. The chart's
# `existingSecret` expects keys named `rootUser` and `rootPassword`. Store the
# item in 1Password under `minio-root/username` and `minio-root/password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef: {key: minio-root/username}
    - secretKey: rootPassword
      remoteRef: {key: minio-root/password}
---
# Jenkins-facing credentials. Jenkins references this secret from its JCasC to
# push artifacts and backups to MinIO. Kept separate from the root creds so
# they can be rotated independently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-jenkins
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-jenkins
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef: {key: minio-jenkins/username}
    - secretKey: secretKey
      remoteRef: {key: minio-jenkins/password}
