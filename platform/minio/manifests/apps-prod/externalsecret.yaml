# MinIO root credentials for the apps-prod instance.
#
# Sourced from the taptech-prod 1P vault (item `minio-root`, fields
# `username` + `password`). Distinct credentials from the mgmt-cluster
# minio -- do not reuse across clusters.
#
# The community minio chart's `existingSecret` expects the Secret to
# expose keys named `rootUser` + `rootPassword`, so remap from the 1P
# field labels via the ExternalSecret template.
#
# minio-jenkins is deliberately NOT provisioned here -- Jenkins runs on
# the mgmt cluster and consumes a separate credential in that vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef: {key: minio-root/username}
    - secretKey: rootPassword
      remoteRef: {key: minio-root/password}
