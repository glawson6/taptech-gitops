# Mgmt-cluster overrides for MinIO. Both ingresses target subdomains of
# taptech.net; cert-manager (letsencrypt-staging) issues certs. Swap the
# annotation to letsencrypt-prod once staging certs render successfully.
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio.taptech.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # MinIO's S3 API expects large uploads; unblock them at the ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tls:
    - hosts: [minio.taptech.net]
      secretName: minio-tls
consoleIngress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio-console.taptech.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Console (browser UI) is admin-facing -- allowlist. TODO: your IP.
    # NOTE: the S3 API ingress above (minio.taptech.net) intentionally has NO
    # allowlist so external CI/tools can push objects with valid credentials.
    # If you never need external S3 access, add the same annotation there too.
    nginx.ingress.kubernetes.io/whitelist-source-range: "104.14.172.65/32"
  tls:
    - hosts: [minio-console.taptech.net]
      secretName: minio-console-tls
