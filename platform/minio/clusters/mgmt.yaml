# Mgmt-cluster overrides for MinIO. Both ingresses target subdomains of
# taptech.net; cert-manager (letsencrypt-staging) issues certs. Swap the
# annotation to letsencrypt-prod once staging certs render successfully.
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio.taptech.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # MinIO's S3 API expects large uploads; unblock them at the ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tls:
    - hosts: [minio.taptech.net]
      secretName: minio-tls
consoleIngress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio-console.taptech.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  tls:
    - hosts: [minio-console.taptech.net]
      secretName: minio-console-tls
