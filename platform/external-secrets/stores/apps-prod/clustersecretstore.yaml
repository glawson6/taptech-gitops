# Application-cluster vault: runtime secrets for the services only.
#
# The store is named 'onepassword' on every cluster deliberately -- an
# ExternalSecret can then reference the same store name regardless of which
# cluster it lands on. Isolation comes from the clusters being separate, each
# holding its own service-account token for its own vault, so no namespace
# label or conditions block is load-bearing here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: taptech-prod
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
          namespace: external-secrets
