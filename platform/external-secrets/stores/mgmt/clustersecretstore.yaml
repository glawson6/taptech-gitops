# Management-cluster vault: CI and control-plane credentials only.
# Registry push, the GitOps PAT, Grafana admin, Argo CD OIDC/admin.
# Deliberately NOT the credentials any application uses at runtime.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: taptech-mgmt
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
          namespace: external-secrets   # mandatory on ClusterSecretStore
