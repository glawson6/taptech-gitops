# Pull credentials for the external registry, assembled into a dockerconfigjson
# from two plain fields. Storing the rendered dockerconfigjson in 1Password
# would work too, but then rotating means hand-editing base64.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull
  namespace: taptech-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.taptech.net":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: registry-pull/username
    - secretKey: password
      remoteRef:
        key: registry-pull/credential
