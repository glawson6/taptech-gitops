# Runtime secret for the sentinel operator.
#
# The chart's deployment template (deployment/helm/templates/deployment.yaml
# in the taptech-sentinel repo) reads these as secretKeyRef against a Secret
# named `<release>-secrets`. Our Application release name is `sentinel`, so
# this Secret MUST be named `sentinel-secrets` and MUST expose exactly these
# keys: anthropic-api-key, telegram-bot-token.
#
# Values come from two 1P items in vault `taptech-prod` (both copied from
# TapTech-Security earlier):
#   MiniMax-Anthropic-API   field: anthropic-api-key         -> anthropic-api-key
#   TapTech-Sentinel-Bot    field: taptech-sentinel-bot-token -> telegram-bot-token
#
# Note: allowed Telegram user IDs are not a credential; they live in the
# per-cluster values file (clusters/apps-prod.yaml -> jaiclaw.telegram.allowedUsers)
# because the chart renders them as a plain env value, not a secretKeyRef.
#
# Rotation: the chart's Deployment already carries reloader.stakater.com/auto,
# so a rotated 1Password value propagates without a manual restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-secrets
  namespace: sentinel-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sentinel-secrets
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: MiniMax-Anthropic-API/anthropic-api-key
    - secretKey: telegram-bot-token
      remoteRef:
        key: TapTech-Sentinel-Bot/taptech-sentinel-bot-token
    # SMTP2GO API key for the daily threat-report email. Consumed by
    # the chart when smtp2go.enabled is true (see per-cluster values).
    - secretKey: smtp2go-api-key
      remoteRef:
        key: SMTP2GO_API/api-key
