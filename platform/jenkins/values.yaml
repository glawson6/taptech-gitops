controller:
  # Admin credentials come from 1Password, never from this file.
  admin:
    existingSecret: jenkins-admin
    userKey: username
    passwordKey: password
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits:   {memory: 3Gi}
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - job-dsl:latest
    # AWS-S3-compatible plugins to talk to MinIO. Despite the name, these
    # plugins never call AWS: `withAWS(endpointUrl: 'http://minio...')` in
    # pipelines routes every request to the in-cluster MinIO service. The
    # credential type is just Jenkins's shape for an accessKey/secretKey pair.
    - aws-credentials:latest
    - pipeline-aws:latest
  installLatestPlugins: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.taptech.net
    tls:
      - hosts: [jenkins.taptech.net]
        secretName: jenkins-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      # Jenkins is chatty; bump proxy buffer sizes so large plugin uploads
      # and long build-log streams don't die at the ingress.
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      # UI allowlist. TODO: set your workstation IP. If Jenkins needs to
      # receive GitHub/GitLab webhooks, add their published CIDR ranges:
      #   https://api.github.com/meta  (see .hooks)
      # See docs/mgmt-ui-inventory.md for the pattern.
      nginx.ingress.kubernetes.io/whitelist-source-range: "REPLACE-WITH-YOUR-IP/32"
  # additionalExistingSecrets projects K8s Secrets into the controller as env
  # vars named `<secretName>-<keyName>`. JCasC references those env vars via
  # `${name}` substitution below. Rotating the K8s Secret content triggers a
  # Reloader restart of the Jenkins pod (annotation on the ExternalSecret).
  additionalExistingSecrets:
    - name: minio-jenkins
      keyName: accessKey
    - name: minio-jenkins
      keyName: secretKey
  JCasC:
    defaultConfig: true
    configScripts:
      agents: |
        jenkins:
          clouds:
            - kubernetes:
                name: "in-cluster"
                # Jenkins now runs INSIDE the cluster it schedules agents on, so
                # there is no API URL, no CA bundle and no service-account token
                # to paste anywhere. It uses its own pod identity.
                serverUrl: ""
                namespace: "jenkins-agents"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                podRetention: "never"
      minio: |
        # Register MinIO as an "AWS Credentials" entry so the pipeline-aws
        # plugin's withAWS() step can use it. The credentials themselves come
        # from env vars projected by additionalExistingSecrets above; JCasC
        # substitutes ${name} at controller startup.
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - aws:
                      scope: GLOBAL
                      id: minio-jenkins
                      description: "MinIO S3 credentials (mgmt cluster)"
                      accessKey: "${minio-jenkins-accessKey}"
                      secretKey: "${minio-jenkins-secretKey}"
        unclassified:
          # Global default so pipelines don't need to repeat the endpoint on
          # every withAWS() call. Region is required by the AWS SDK even for
          # non-AWS S3; any value works.
          awsCredentialsBinding:
            defaultCredentialsId: "minio-jenkins"
  sidecars:
    # k8s-sidecar 2.10.1 uses Python 3.15 which rejects the MicroK8s CA
    # cert with "CA cert does not include key usage extension". MicroK8s'
    # in-cluster CA doesn't set the keyUsage extension. Skip verification
    # -- the sidecar only talks to the in-cluster API which is otherwise
    # trusted, and the auto-reload watches ConfigMaps in its own namespace.
    configAutoReload:
      env:
        - name: SKIP_TLS_VERIFY
          value: "true"
  serviceAccount:
    create: true
    name: jenkins
persistence:
  enabled: true
  storageClass: taptech-standard
  size: 20Gi
agent:
  enabled: true
  namespace: jenkins-agents
  podName: agent
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits:   {cpu: "2", memory: 4Gi}
rbac:
  create: true
serviceAccountAgent:
  create: true
  name: jenkins-agent
