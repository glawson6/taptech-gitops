# Everything Jenkins needs to authenticate, sourced from the management vault.
# Rotating any of these is a 1Password edit -- no Jenkins UI, no commit here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: jenkins-admin, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: jenkins-admin/username}
    - secretKey: password
      remoteRef: {key: jenkins-admin/password}
---
# Push credential for the external registry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-push
  namespace: jenkins-agents
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: registry-push
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.taptech.net":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: {key: registry-push/username}
    - secretKey: password
      remoteRef: {key: registry-push/password}
---
# PAT used to commit image-tag bumps back into this repo.
#
# Rendered with kubernetes-credentials-provider labels + annotations so it
# appears in the Jenkins Credentials store automatically as a
# UsernamePassword entry with id=gitops-repo. Reference from a pipeline:
#   credentials('gitops-repo')     // -> GITOPS_REPO_USR / GITOPS_REPO_PSW
#
# Lives in the `jenkins` namespace (not jenkins-agents) because the plugin
# scans the controller's own namespace by default; putting it here avoids
# extra RBAC + a second namespace scan config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-repo
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: gitops-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # kubernetes-credentials-provider hooks: type + auto-mirror.
          jenkins.io/credentials-type: usernamePassword
        annotations:
          jenkins.io/credentials-description: 'GitHub PAT for taptech-gitops tag-bump commits'
      # Data keys for usernamePassword are literally `username` + `password`.
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef: {key: gitops-repo/username}
    - secretKey: password
      remoteRef: {key: gitops-repo/password}
---
# MinIO S3 credentials used by Jenkins pipelines via the pipeline-aws plugin's
# withAWS() step. Lives in the jenkins namespace (not minio) so the controller's
# additionalExistingSecrets can project it into env vars: K8s Secrets do not
# cross namespaces. The reloader annotation restarts the controller whenever
# these creds rotate in 1Password, so JCasC picks the new values up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-jenkins
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: minio-jenkins, creationPolicy: Owner}
  data:
    - secretKey: accessKey
      remoteRef: {key: minio-jenkins/username}
    - secretKey: secretKey
      remoteRef: {key: minio-jenkins/password}
# Reloader picks up Secret changes based on annotations on the CONSUMING
# workload, not the Secret itself. The Jenkins StatefulSet doesn't have
# `reloader.stakater.com/auto: "true"` today (Jenkins persists JCasC state to
# PVC and rewinding is not always safe). Manual restart after rotating
# minio-jenkins creds: `kubectl -n jenkins rollout restart statefulset/jenkins`.
