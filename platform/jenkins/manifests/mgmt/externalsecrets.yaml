# Everything Jenkins needs to authenticate, sourced from the management vault.
# Rotating any of these is a 1Password edit -- no Jenkins UI, no commit here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: jenkins-admin, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: jenkins-admin/username}
    - secretKey: password
      remoteRef: {key: jenkins-admin/password}
---
# Push credential for the external registry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-push
  namespace: jenkins-agents
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: registry-push
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.taptech.net":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: {key: registry-push/username}
    - secretKey: password
      remoteRef: {key: registry-push/credential}
---
# PAT used to commit image-tag bumps back into this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-repo
  namespace: jenkins-agents
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: gitops-repo, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: gitops-repo/username}
    - secretKey: password
      remoteRef: {key: gitops-repo/credential}
