# Keycloak prod overrides for the apps-prod (MicroK8s) cluster.
# Mirrors deployment/helm/taptech-keycloak/values-prod.yaml from the
# taptech-company repo, adapted for this cluster's ingress-nginx setup.

image:
  # Pin by digest in prod. The build-keycloak-image.sh script prints
  # the digest after pushing; copy it here.
  digest: "sha256:d484f7e2c57c5e69ec65af75907ed86ecfa10810f0a2fa1e425f39d8265d4770"

hostname: id.taptech.net

ingress:
  enabled: true
  # apps-prod uses ingress-nginx (className `nginx`), not microk8s'
  # bundled `public` class.
  className: nginx
  host: id.taptech.net
  tls:
    secretName: id-taptech-net-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # Note: HSTS via configuration-snippet is disabled on this cluster's
    # ingress-nginx (admission webhook rejects it). If HSTS is required,
    # enable it via the ingress-nginx controller ConfigMap
    # (hsts: "true", hsts-preload: "true", hsts-max-age, hsts-include-subdomains)
    # or set Keycloak's KC_HTTP_RESPONSE_HEADERS env instead.

# Admin ingress: OFF for the first landing. Reach /admin via
# `kubectl port-forward svc/keycloak 8080:8080`. Populate
# adminAllowedCidrs + set adminIngress.host to expose it later.
adminAllowedCidrs: []

networkPolicy:
  enabled: true
  # apps-prod runs the community ingress-nginx chart. Namespace and
  # pod label match that chart's defaults, not the microk8s bundled
  # controller.
  ingressNginxNamespace: ingress-nginx
  ingressNginxPodLabel:
    key: app.kubernetes.io/name
    value: ingress-nginx

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 2Gi
