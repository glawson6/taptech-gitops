# External Secrets Operator manifests that materialize the k8s Secrets
# the taptech-keycloak chart consumes.
#
# The chart's Deployment + bootstrap Job read Secrets by name (see
# platform/keycloak/values.yaml -> onePassword.items[].secretName). We
# create Secrets with those exact names + field keys here.
#
# Prerequisites in the 1Password vault `taptech-prod`:
#   - KEYCLOAK_DB                       fields: username, password
#   - KEYCLOAK_BOOTSTRAP_ADMIN          fields: username, password
#   - KEYCLOAK_PLATFORM_SUPERADMIN      fields: username, password
#   - KEYCLOAK_TENANT_DEFAULT_ADMIN     fields: username, password
#
# Rotation: the chart's Deployment carries reloader.stakater.com/auto,
# so a rotated 1Password value propagates without a manual restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-keycloak-db
  namespace: taptech
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taptech-keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: KEYCLOAK_DB/username
    - secretKey: password
      remoteRef:
        key: KEYCLOAK_DB/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-keycloak-bootstrap
  namespace: taptech
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taptech-keycloak-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: KEYCLOAK_BOOTSTRAP_ADMIN/username
    - secretKey: password
      remoteRef:
        key: KEYCLOAK_BOOTSTRAP_ADMIN/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-keycloak-platform-superadmin
  namespace: taptech
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taptech-keycloak-platform-superadmin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: KEYCLOAK_PLATFORM_SUPERADMIN/username
    - secretKey: password
      remoteRef:
        key: KEYCLOAK_PLATFORM_SUPERADMIN/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taptech-keycloak-tenant-default-admin
  namespace: taptech
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
