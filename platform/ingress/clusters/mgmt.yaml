# Single-node MicroK8s: DaemonSet + hostPort binds the controller directly to
# the node's :80 and :443. No LoadBalancer exists on the box, so a Service of
# type LoadBalancer would sit in <pending> forever. The microk8s `ingress`
# addon is disabled by scripts/prep-microk8s.sh so it doesn't collide with
# this controller for the same host ports.
controller:
  kind: DaemonSet
  hostPort:
    enabled: true
    ports: {http: 80, https: 443}
  service:
    enabled: true
    type: NodePort
  # The admission webhook needs a PreSync Job to provision its TLS cert
  # (kube-webhook-certgen). On a resource-tight single-node mgmt cluster
  # that Job has repeatedly stalled and left ArgoCD stuck waiting for it,
  # blocking every subsequent sync-wave. Skip it here: this cluster's
  # small trusted user base doesn't need runtime validation of Ingress
  # specs, and ArgoCD already server-side validates before applying.
  admissionWebhooks:
    enabled: false
