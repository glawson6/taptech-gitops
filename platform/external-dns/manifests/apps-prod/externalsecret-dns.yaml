# This token can rewrite every record in the zone, so it is a per-cluster
# credential from that cluster's own vault -- not one token shared around.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: apiToken
      remoteRef:
        key: cloudflare-dns/credential
