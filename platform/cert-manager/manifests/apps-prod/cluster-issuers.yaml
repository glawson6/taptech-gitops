# Applied at sync-wave 4 so the cert-manager Helm chart (default wave 0) has
# already installed the CRDs AND the webhook Deployment is running -- otherwise
# the ClusterIssuer applies but never reaches Ready because there's no webhook
# to validate it, and ArgoCD blocks the whole App on the health barrier.
# Let's Encrypt rate-limits per registered domain, and both clusters request
# certs for taptech.net -- staging first on a new cluster is not optional advice.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@taptech.net   # TODO confirm
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
            # cert-manager creates a temporary Ingress per HTTP-01 challenge.
            # ingress-nginx enables ssl-redirect automatically for any host
            # with a TLS block, so LE's plain-HTTP request to
            # /.well-known/acme-challenge/... gets a 308 -> https and the
            # challenge fails. Injecting ssl-redirect: false onto the
            # solver Ingress exempts just those paths from the redirect.
            ingressTemplate:
              metadata:
                annotations:
                  nginx.ingress.kubernetes.io/ssl-redirect: "false"
                  nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@taptech.net   # TODO confirm
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
            # cert-manager creates a temporary Ingress per HTTP-01 challenge.
            # ingress-nginx enables ssl-redirect automatically for any host
            # with a TLS block, so LE's plain-HTTP request to
            # /.well-known/acme-challenge/... gets a 308 -> https and the
            # challenge fails. Injecting ssl-redirect: false onto the
            # solver Ingress exempts just those paths from the redirect.
            ingressTemplate:
              metadata:
                annotations:
                  nginx.ingress.kubernetes.io/ssl-redirect: "false"
                  nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
