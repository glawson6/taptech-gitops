# Applied a wave after the chart so the CRDs exist.
# Let's Encrypt rate-limits per registered domain, and both clusters request
# certs for taptech.net -- staging first on a new cluster is not optional advice.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@taptech.net   # TODO confirm
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@taptech.net   # TODO confirm
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
